[project]
name = "trakcli"
version = "0.0.6"
description = "Keep a record of the time you dedicate to your projects."
authors = [
  { name = "Luca Fedrizzi", email = "9001053+fedriz@users.noreply.github.com" },
]
readme = "README.md"
keywords = ["cli", "timetraker", "time", "traker", "tool"]
dependencies = [
    "rich-toolkit>=0.20",
    "sqlalchemy>=2.0",
    "sqlmodel>=0.0.48",
    "typer>=0.27",
]
requires-python = ">=3.11"

license = { text = "AGPL-3.0" }

[project.urls]
Homepage = "https://usetrak.com/"
Repository = "https://github.com/lcfd/trak"
Website = "https://usetrak.com"
Docs = "https://docs.usetrak.com"

[project.scripts]
trak = "trak.__main__:app"

[dependency-groups]
dev = ["ruff>=0.17", "pytest>=9.1", "pdbpp>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trak"]

[tool.pytest.ini_options]
testpaths = ["tests"]
