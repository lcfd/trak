[tool.poetry]
name = "trakcli"
version = "0.0.6"
description = "Keep a record of the time you dedicate to your projects."
authors = ["Luca Fedrizzi <9001053+fedriz@users.noreply.github.com>"]
license = "AGPL-3.0"
readme = "README.md"
homepage = "https://usetrak.com/"
repository = "https://github.com/lcfd/trak"
keywords = ["cli", "timetraker", "time", "traker", "tool"]


[tool.poetry.urls]
"Website" = "https://usetrak.com"
"Docs" = "https://docs.usetrak.com"
"Trak on X" = "https://x.com/usetrakcom"
"Luca Fedrizzi's website" = "https://lucafedrizzi.com/"
"Luca Fedrizzi on X" = "https://x.com/lc_fd"


[tool.poetry.scripts]
trak = "trakcli.__main__:app"

[tool.poetry.dependencies]
python = "^3.11"
typer = { extras = ["all"], version = ">=0.9.0" }
questionary = ">=2.0.1"

[tool.poetry.group.dev.dependencies]
black = ">=23.9.1"
ruff = ">=0.6.4"
pytest = ">=7.4.4"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
